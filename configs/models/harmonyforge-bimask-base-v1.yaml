schema_version: 1
model_id: harmonyforge-bimask-base-v1
task: melody_conditioned_variable_rhythm_harmonization

representation:
  ppq: 480
  harmonic_frame: sixteenth
  maximum_bars: 128
  maximum_frames_per_window: 256
  key_relative_roots: true
  streams:
    - global
    - structure
    - melody
    - harmony
  primary_harmony_heads:
    event: [no_chord, hold, change]
    root_classes: 12
    quality_source: frontend/src/types/music.ts#ChordQuality
    inversion: [root, first, second, third, other_analysis_only]
    bass_classes: 12
    extensions: ["6", "9", "b9", "#9", "11", "#11", "13", "b13"]
  architecture_only_auxiliary_heads:
    function: [tonic, predominant, dominant, other]
    cadence: [none, authentic, plagal, half, deceptive, loop]
    trained_by_reference_cli: false

architecture:
  family: bidirectional_masked_transformer
  layers: 12
  hidden_size: 768
  attention_heads: 12
  feed_forward_size: 4096
  normalization: pre_norm
  activation: gelu
  dropout: 0.1
  positional_encoding: learned_window_plus_bar_and_meter
  bar_summary_tokens: true
  factorized_output_heads: true

training:
  implementation_status: deterministic_single_process_reference
  default_seed: "1729"
  objective: mean_normalized_active_head_cross_entropy
  trained_heads: [event, root, quality, inversion, bass, extensions]
  untrained_architecture_only_heads: [function, cadence]
  masking:
    - full_harmony
    - contiguous_range
    - disjoint_ranges
    - random_frames
    - causal_suffix
  optimizer: adamw
  learning_rate_schedule: constant
  precision: float32
  distributed: false
  gradient_clipping_norm: 1.0
  validation_selection: full_mask_metrics_research_only
  future_release_gates:
    - three_or_more_training_seeds
    - warmup_cosine_ablation
    - mixed_precision_training
    - distributed_data_parallel
    - preregistered_locked_test_selection
    - listening_study
  raw_data_in_git: false

inference:
  default_candidate_count: 32
  output_mode: preview_only
  seeded: true
  hard_constraint_precedence: true
  candidate_decoding_batch: 1
  batch_reduction_on_oom: false
  fallback_order: [cuda, mps, cpu, corpus, theory]

runtime:
  framework: pytorch
  reference_training:
    precision: float32
    process_count: 1
  cuda:
    inference_precision_order: [bfloat16, float16, float32]
  mps:
    inference_precision_order: [float16, float32]
    report_cpu_operation_fallback: true
  cpu:
    inference_precision_order: [float32, bfloat16]

artifact:
  checkpoint_format: safetensors
  manifest_required:
    - architecture
    - architecture_config_sha256
    - checkpoint_sha256
    - tokenizer_sha256
    - data_manifest_file
    - data_manifest_sha256
    - training_run_file
    - training_run_sha256
    - source_commit
    - pytorch_version
    - minimum_app_version
    - minimum_api_version
    - supported_precisions
