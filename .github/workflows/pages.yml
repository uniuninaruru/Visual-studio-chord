name: Pages

# Publishes the browser-only build. The app generates, edits, plays, and exports
# entirely in the browser, so the published site needs no server: the backend is
# only ever used for candidate re-ranking and neural inference, both of which are
# skipped when it is absent.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running publish; let it finish and supersede it afterwards.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build for the repository subpath
        env:
          # Pages serves this under /<repo>/, and Vite bakes asset URLs in at
          # build time, so the base cannot be decided later.
          VITE_BASE: /${{ github.event.repository.name }}/
        run: pnpm --filter @visual-studio-chord/frontend build
      - name: Serve the app for unknown paths
        # Pages has no rewrite rules. Copying index.html to 404.html makes a
        # deep link render the app instead of GitHub's error page.
        run: cp frontend/dist/index.html frontend/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
