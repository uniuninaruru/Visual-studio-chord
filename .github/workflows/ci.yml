name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  launchers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Run portable setup
        if: runner.os != 'Windows'
        env:
          MTC_PACKAGE_MANAGER: npm
        run: ./scripts/setup.sh
      - name: Run portable Windows setup
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MTC_PACKAGE_MANAGER: npm
        run: .\scripts\setup.ps1
      - name: Validate POSIX launchers
        if: runner.os != 'Windows'
        run: |
          bash -n scripts/*.sh
          python3 scripts/check-environment.py --skip-backend
          python3 scripts/verify_acceleration.py --json
          python3 -m unittest discover -s scripts/tests
      - name: Validate Windows launchers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem scripts -Filter *.ps1) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List | Out-String | Write-Error
              exit 1
            }
          }
          python scripts/check-environment.py --skip-backend
          python scripts/verify_acceleration.py --json
          python -m unittest discover -s scripts/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir frontend typecheck
      - run: pnpm --dir frontend lint
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build
      - run: node scripts/generate-api-types.mjs --check --skip-export

  npm-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund

  browser-e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chromium
          - os: macos-latest
            browser: webkit
          - os: windows-latest
            browser: chromium
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - if: runner.os != 'Linux'
        run: pnpm exec playwright install ${{ matrix.browser }}
      - run: pnpm exec playwright test --project=${{ matrix.browser }}

  lan-mobile-e2e:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install pip==25.0.1 setuptools==83.0.0
      - run: python -m pip install --requirement backend/requirements.runtime.lock
      - run: python -m pip install --no-deps --no-build-isolation --editable backend
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --config=playwright.lan.config.ts

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: python -m pip install pip==25.0.1 setuptools==83.0.0
      - run: python -m pip install --requirement backend/requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation --editable backend
      - run: python scripts/export-openapi.py --check
      - run: python -m pytest
        working-directory: backend
      - run: python -m ruff check app tests
        working-directory: backend

  containers:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    env:
      MTC_SHARED_TOKEN: ci-only-token-00000000000000000000000000000000
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose build
