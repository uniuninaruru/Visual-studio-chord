name: harmony-lab

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      MTC_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      MTC_SHARED_TOKEN: "${MTC_SHARED_TOKEN:?Run scripts/start-local.sh or scripts/start-local.ps1 first}"
    expose:
      - "8765"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${MTC_FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
