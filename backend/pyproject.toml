[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "music-theory-composer-backend"
version = "0.2.0"
description = "Local FastAPI service for Music Theory Composer"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi==0.139.2",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
torch = [
  "torch==2.13.0; (platform_system == 'Darwin' and platform_machine == 'arm64') or (platform_system == 'Linux' and platform_machine == 'x86_64') or (platform_system == 'Linux' and platform_machine == 'aarch64') or (platform_system == 'Windows' and platform_machine == 'AMD64')",
]
onnx = [
  "onnxruntime==1.27.0; (platform_system == 'Darwin' and platform_machine == 'arm64') or (platform_system == 'Linux' and platform_machine == 'x86_64') or (platform_system == 'Linux' and platform_machine == 'aarch64') or (platform_system == 'Windows' and platform_machine == 'AMD64') or (platform_system == 'Windows' and platform_machine == 'ARM64')",
]
onnx-cuda = [
  "onnxruntime-gpu==1.27.0; (platform_system == 'Linux' and platform_machine == 'x86_64') or (platform_system == 'Windows' and platform_machine == 'AMD64')",
]
onnx-directml = [
  "onnxruntime-directml==1.24.4; platform_system == 'Windows' and platform_machine == 'AMD64'",
]
test = [
  "httpx==0.28.1",
  "pytest==8.4.2",
  "ruff==0.15.22",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
